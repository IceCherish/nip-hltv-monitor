name: NIP 手动测试
run-name: 手动运行：${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行内容"
        required: true
        type: choice
        default: monitor
        options:
          - monitor
          - reset_state
          - test_notification
          - test_article

permissions:
  contents: write

concurrency:
  group: nip-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取项目
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查更新
        env:
          NEWS_MODE: ${{ vars.NEWS_MODE || 'all' }}
          REMINDER_MINUTES: ${{ vars.REMINDER_MINUTES || '30' }}
          SCHEDULE_LOOKAHEAD_DAYS: ${{ vars.SCHEDULE_LOOKAHEAD_DAYS || '7' }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER || 'auto' }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_REGION: ${{ vars.TENCENT_REGION || 'ap-beijing' }}
          TENCENT_TERM_REPO_ID: ${{ vars.TENCENT_TERM_REPO_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          case "${{ inputs.mode }}" in
            reset_state) python monitor.py --reset-news-state ;;
            test_notification) python monitor.py --test-notification ;;
            test_article) python monitor.py --test-rich-article ;;
            *) python monitor.py ;;
          esac

      - name: 保存去重记录
        if: ${{ success() && (inputs.mode == 'monitor' || inputs.mode == 'reset_state') }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "没有状态变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update monitor state"
          git push
